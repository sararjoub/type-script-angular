<div class="container">

  <app-header></app-header>

  <app-navbar></app-navbar>

  <h3 class="status">{{ storeStatus }}</h3>

  <app-product-list></app-product-list>

  <app-product-details></app-product-details>

  <h2>Store Summary</h2>

  <div class="summary">

    <div class="summary-box">
      <h3>{{ totalProducts }}</h3>
      <p>Total Products</p>
    </div>

    <div class="summary-box">
      <h3>${{ highestPrice }}</h3>
      <p>Highest Price</p>
    </div>

    <div class="summary-box">
      <h3>${{ lowestPrice }}</h3>
      <p>Lowest Price</p>
    </div>

    <div class="summary-box">
      <h3>${{ totalValue }}</h3>
      <p>Total Products Value</p>
    </div>

  </div>

  <app-footer></app-footer>

</div>
